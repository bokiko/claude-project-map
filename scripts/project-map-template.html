</main><script type="application/json" id="state">/*__PM_STATE__*/null</script>
<script>

const $=id=>document.getElementById(id);

$('tagline').textContent=project.tagline||project.goal||'';
const fullFolder=identity.folder||'';const shortFolder=fullFolder.charAt(0)==='~'||fullFolder.split('/').length<=3?fullFolder:'…/'+fullFolder.split('/').filter(Boolean).slice(-2).join('/');
$('metadata').textContent=[shortFolder,identity.branch,(identity.snapshot_at||'').slice(0,10)].filter(Boolean).join(' · ');const relRepo=(state.repos||[]).find(r=>r&&r.release&&typeof r.release.line==='string'&&r.release.line);if(relRepo){const rlEl=$('release-line');rlEl.textContent='git: '+relRepo.release.line;rlEl.hidden=false;rlEl.style.marginTop='3px';}
const ask=decisions.filter(d=>d.ready!==false),later=decisions.filter(d=>d.ready===false);
const ATT_WORD={unchecked:'not fully checked'};/* 3.6.1: the owner-facing word for an attention kind */
/* 13.4: one three-way answer to "does anything need me?". (a) a ready decision is open -> Needs you; (b) none and the assessment
   is complete -> Nothing needs you; (c) none but the assessment is incomplete -> Nothing found that needs you (partial check),
   with the reasons. A state from before 3.4 has no assurance: the earlier wording stays. */
const A=state.assurance&&Array.isArray(state.assurance.why)?state.assurance:null;
const needsCase=ask.length?'a':(!A||A.ok)?'b':'c';
const needsWord={a:'Needs you',b:'Nothing needs you',c:'Nothing found that needs you (partial check)'}[needsCase];
$('needs-pill').textContent=(!A&&state.stale)?'Assessment may be out of date':needsWord;

/* 15.1: a completion ref the scripts found gone is "completion unverified": `done` is never flipped by a script, the mark says the evidence is not there */
const ev=state.evidence&&typeof state.evidence==='object'?state.evidence:null,lostBy={};for(const e of (ev&&Array.isArray(ev.lost)?ev.lost:[]))if(e&&e.id)lostBy[e.id]=e;

const unvText=id=>'completion unverified'+(lostBy[id]&&lostBy[id].why?' · '+lostBy[id].why:'');
$('progress').textContent=percent+'%';$('progress-note').textContent=shipped+' of '+criteria.length+(unvCount?' ('+unvCount+' unverified)':'')+(ev&&ev.checked==='partial'?' · evidence check '+ev.done+' of '+ev.n:'');$('progress-fill').style.width=percent+'%';

const sn=state.since&&typeof state.since==='object'?state.since:null;
const intent=state.intent&&typeof state.intent==='object'?state.intent:null;
if(sn){
 const box=$('since'),at=sn.from&&sn.from.assessed_at?String(sn.from.assessed_at):'';
 box.append(el('p','eyebrow','Since the previous assessment'+(at?' · '+at.slice(0,10):'')));
 const total=sn.commits||0,listed=typeof sn.listed==='number'?sn.listed:null;
 box.append(el('p','since-line',total+' commits · '+(sn.dirty||0)+' uncommitted files'+(listed!==null&&listed<total?' · the map read '+listed+' of '+total+' commits':'')));
 const att=sn.attention;
 if(att&&att.kind){const row=el('div','since-row');row.dataset.attention=att.kind;row.append(el('p','eyebrow','Attention · '+(ATT_WORD[att.kind]||att.kind)+(att.id?' '+att.id:'')),el('p','since-text',att.text||''),el('p','since-why',att.why||''));box.append(row);}

 const acc=intent&&intent.accepted&&typeof intent.accepted==='object'?intent.accepted:null,prop=intent&&intent.proposed&&typeof intent.proposed==='object'?intent.proposed:null,fo=acc||prop;
 if(fo&&typeof fo.outcome==='string'&&fo.outcome){const frow=el('p','since-focus','focus: '+fo.outcome+' ('+(acc?'confirmed'+(/^\d{4}-\d{2}-\d{2}/.test(String(acc.at||''))?' '+String(acc.at).slice(0,10):''):'proposed, not confirmed')+')');frow.dataset.focus=acc?'confirmed':'proposed';box.append(frow);if(acc&&prop&&typeof prop.outcome==='string')box.append(el('p','since-why','the map suggests a different focus: '+prop.outcome));}

 if(fit&&typeof fit.verdict==='string'){/* 15.2: how the inspected work fits the intention, with the scope the model actually saw */
  const sc=fit.scope&&typeof fit.scope==='object'?fit.scope:{},scope=(typeof sc.shown==='number'&&typeof sc.total==='number'&&sc.shown<sc.total)?' ('+sc.shown+' of '+sc.total+' commits shown)':'';

  const fe=el('p','since-fit',ftxt);fe.dataset.fit=fit.verdict;box.append(fe);

 if(nc.length)box.append(el('p','since-nc','not checked: '+nc.join('; ')));

}
/* 3.6.1: a card per decision. Only a ready one needs the owner now (it sits under the current phase); a ready:false one is a
   later decision, listed under "Later decisions" and never worded as waiting for an answer. */
function decisionCard(d){const card=el('section','decision');card.dataset.decision=d.id;if(d.ready===false)card.dataset.later='1';card.append(el('h3','',d.q));const options=el('div','options');for(const o of d.options||[]){const p=el('p','option');p.append(el('b','',o.id),document.createTextNode(o.label));options.append(p);}const dd=d.deadline?new Date(d.deadline):null;const dtext=dd&&!isNaN(dd)?dd.toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'';card.append(options,el('p','answer-hint',d.ready===false?'Not asked yet'+(d.hard_rule?' · will need your explicit answer':''):d.hard_rule?'Waits for your answer':'Default '+(d.default==='hold'?'hold':d.default)+(dtext?' on '+dtext:'')));return card;}
const buttons=[];

 for(const c of phase.criteria||[]){const row=el('li','criterion'+(c.done?'':' open'));row.dataset.criterion=c.id;const check=el('span','check',c.done?'✓':'');check.setAttribute('aria-label',c.done?'Shipped':'Open');const text=el('div');text.append(el('p','criterion-label',c.text));if(c.unverified){row.dataset.unverified='1';text.append(el('p','criterion-flag',unvText(c.id)));}row.append(check,text);list.append(row);}area.append(list);
 if(phase.id===current?.id)for(const d of ask)area.append(decisionCard(d));
 const resolved=phase.id===current?.id?(state.decisions||[]).filter(d=>d.status==='overtaken'):[];
 if(resolved.length){const box=el('section','decision');box.dataset.region='resolved-by-events';box.append(el('p','eyebrow','Resolved by events'));for(const d of resolved){const r=el('div');r.dataset.overtaken=d.id;r.append(el('h3','',d.id+' · '+d.q),el('p','answer-hint',(d.overtaken_why||'')+(d.overtaken_ref?' ('+d.overtaken_ref+')':'')));box.append(r);}area.append(box);}
}
phases.forEach((p,i)=>{const b=el('button','phase-button');b.type='button';b.dataset.phase=p.id;if(p.id===current?.id)b.setAttribute('aria-current','step');const text=el('span');b.setAttribute('role','tab');text.append(el('span','phase-name',p.label),el('span','phase-state',STATE_WORD[p.state]||p.state));b.append(el('span','phase-number mono',String(i+1).padStart(2,'0')),text,el('span','phase-count mono',p.done+' / '+p.total));b.title=p.label;b.addEventListener('click',()=>selectPhase(p));b.addEventListener('keydown',e=>{let j;if(e.key==='ArrowDown')j=(i+1)%phases.length;else if(e.key==='ArrowUp')j=(i-1+phases.length)%phases.length;else if(e.key==='Home')j=0;else if(e.key==='End')j=phases.length-1;else return;e.preventDefault();buttons[j].focus();selectPhase(phases[j]);});buttons.push(b);$('phase-list').append(b);});
if(current)selectPhase(current);
function disclosure(label){const d=el('details');d.append(el('summary','',label));const body=el('div','detail-body');d.append(body);$('context').append(d);return body;}
if(typeof state.handoff==='string'&&state.handoff){/* 14.5: the script-rendered handoff, the same text as handoff.txt; textContent only */
 const hb=disclosure('Handoff'),bar=el('div','handoff-bar'),btn=el('button','copy-btn','Copy handoff'),note=el('span','copy-note'),pre=el('pre','handoff-text',state.handoff);
 btn.type='button';note.setAttribute('role','status');pre.id='handoff-text';
 btn.addEventListener('click',()=>{
  const failed=()=>{try{const r=document.createRange();r.selectNodeContents(pre);const sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);}catch(e){}note.textContent='Copy was not allowed here; the text is selected, press Cmd/Ctrl+C.';};
  let p;try{p=navigator.clipboard.writeText(state.handoff);}catch(e){failed();return;}
  if(!p||typeof p.then!=='function'){failed();return;}
  p.then(()=>{note.textContent='Copied.';},failed);
 });
 bar.append(btn,note);hb.append(el('p','','A bounded brief for the next agent or session, written by the scripts from this map. It is context, not permission.'),bar,pre);
}
if(later.length){const lb=disclosure('Later decisions ('+later.length+', not asked yet)');lb.append(el('p','','Questions the map will ask when their time comes. None of them needs you now.'));for(const d of later)lb.append(decisionCard(d));}
const plan=disclosure('Plan vs shipped');plan.append(el('p','','Every criterion, across all phases. Shipped means the recorded criterion is complete.'));
const table=el('table'),thead=el('thead'),hr=el('tr');for(const name of ['Phase','Criterion','Status','Evidence'])hr.append(el('th','',name));thead.append(hr);table.append(thead);const tbody=el('tbody');for(const p of phases)for(const c of p.criteria||[]){const row=el('tr');row.dataset.planCriterion=c.id;row.append(el('td','mono',String(phases.indexOf(p)+1).padStart(2,'0')),el('td','',c.text),el('td','',c.done?(c.unverified?'Shipped · completion unverified':'Shipped'):'Open'));const ref=el('td');ref.append(el('code','mono',c.ref||'—'));row.append(ref);tbody.append(row);}table.append(tbody);plan.append(table);
function records(body,items,title,line,ref){if(!items?.length){body.append(el('p','','Nothing recorded.'));return;}const list=el('ul','context-list');for(const item of items){const row=el('li');row.append(el('strong','',title(item)),el('p','',line(item)));const r=ref?.(item);if(r)row.append(el('code','mono',r));list.append(row);}body.append(list);}
records(disclosure('Parts'),state.parts,p=>p.label+' · '+p.status.replaceAll('_',' '),p=>(p.line||'')+(p.unverified?(p.line?' · ':'')+unvText(p.id):''),p=>p.ref);
records(disclosure('Recent changes'),state.changes,c=>c.label,c=>c.text,c=>c.at);
const risks=disclosure('Risks');records(risks,state.risks,r=>(r.severity||'note')+' risk · '+r.id,r=>r.text||'',null);if(state.headline?.note)risks.append(el('p','',state.headline.note));if(state.loops?.length)records(risks,state.loops,l=>l.id+' · '+l.kind,l=>(l.note||'')+(l.failed?' · '+l.failed+' failed in '+l.rounds+' rounds':''));
records(disclosure('History'),state.history,h=>'Run '+h.run+' · '+h.at,h=>[h.phase?.current,h.phase?h.phase.done+' / '+h.phase.total+' criteria shipped':'',h.counts?h.counts.done+' parts done':''].filter(Boolean).join(' · '),h=>h.generation);
const snapshot=disclosure('Snapshot');for(const [label,value] of [['Headline',state.headline?.text],['Goal',project.goal],['Folder',identity.folder],['Branch / head',[identity.branch,identity.head].filter(Boolean).join(' @ ')],['Tags and sync (local git)',relRepo?relRepo.release.line:''],['Snapshot',identity.snapshot_at],['Assessment',state.judged_at],['Generation',state.generation],['Coverage',state.coverage?state.coverage.coverage+' · '+state.coverage.covered+' / '+state.coverage.total:''],['Stale',state.stale?(state.stale.why||'yes')+' · judged '+state.stale.judged_at:''],['Assurance',A?(A.ok?'complete':A.why.join(' · ')):''],['Completion evidence',ev?ev.done+' of '+ev.n+' checked · '+ev.checked+(ev.lost&&ev.lost.length?' · lost: '+ev.lost.map(e=>e.id).join(', '):''):''],['Fit',state.fit&&state.fit.verdict?state.fit.verdict+(state.fit.concern?' · '+state.fit.concern:''):''],['Working tree',state.status?.dirty+' changed files'],['Next step',next.title],['Why',next.why],['Watched files',(state.watch||[]).join(', ')]]){const row=el('p','snapshot-row');row.append(el('span','',label),el('span','mono',value||'—'));snapshot.append(row);}
const usage=disclosure('Usage'),u=state.usage||{};usage.append(el('p','',(u.totals?.all||0).toLocaleString()+' tokens · '+(u.totals?.jobs||0)+' jobs'+(u.approximate?' · approximate':'')+(u.stale?' · usage as of '+(u.at?String(u.at).slice(0,16).replace('T',' '):'an earlier run'):'')));records(usage,u.by_model,m=>m.model,m=>m.total.toLocaleString()+' tokens · '+m.jobs+' jobs');records(usage,u.jobs,j=>j.label,j=>j.model+' · '+j.in+' in / '+j.out+' out / '+j.cache+' cached',j=>j.at);
if(new URLSearchParams(location.search).get('open')==='1')document.querySelectorAll('details').forEach(d=>d.open=true);
